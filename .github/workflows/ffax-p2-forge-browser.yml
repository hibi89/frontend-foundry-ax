name: FFAX V2.1 P2 real Chromium Forge path
on:
  push:
    branches:
      - feature/ffax-reference-fidelity-20261118
    paths:
      - '.github/workflows/ffax-p2-forge-browser.yml'
      - 'scripts/forge_p2_browser_probe.py'
      - 'src/**'
      - 'scripts/forge_capture.py'
      - 'scripts/forge_capture.mjs'
      - 'index.html'
      - 'styles.css'
permissions:
  contents: read
concurrency:
  group: ffax-p2-forge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  forge-local-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pin browser test runtime, no package installation scripts or remote AI
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install chromium
          CHROME_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          test -x "$CHROME_PATH"
          sudo ln -sfn "$CHROME_PATH" /usr/bin/chromium
      - name: Real direct Chromium capture from frozen typed FFAX source (isolate subprocess)
        run: |
          mkdir -p /tmp/ffax-p2-direct
          node --input-type=module <<'NODE'
          import {writeFile} from 'node:fs/promises';
          import {makeForgeBrief,generateForgeVariants,freezeForgeVariant} from './src/design-forge.mjs';
          const b=await freezeForgeVariant(
            generateForgeVariants(makeForgeBrief({prompt:'Design a local synthetic financial dashboard'}))[0],
            {approval:'APPROVE_FORGE_REFERENCE'});
          await writeFile('/tmp/ffax-p2-direct/bundle.json',JSON.stringify(b),{flag:'wx'});
          NODE
          node scripts/forge_capture.mjs capture --bundle /tmp/ffax-p2-direct/bundle.json --out /tmp/ffax-p2-direct/capture --width 375 --height 600 --dpr 1
          test -s /tmp/ffax-p2-direct/capture/render.png
      - name: P2 React19 preview/export computed-style parity across 375/768/1440
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          python scripts/export_visual_token_browser_probe.py
      - name: P2 live loopback UI revision, SHA render, pixel comparison and blocked original asset
        run: python scripts/forge_p2_browser_probe.py
      - name: Retain synthetic-only browser evidence for defect analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffax-v21-p2-forge-chromium-evidence
          path: artifacts/qa/forge-p2-*
          if-no-files-found: warn
          retention-days: 7
