name: FFAX V2 Design Forge P1 source smoke
on:
  push:
    branches:
      - feature/ffax-reference-fidelity-20261118
    paths:
      - '.github/workflows/ffax-design-forge-p1.yml'
      - 'src/core.mjs'
      - 'src/design-forge.mjs'
      - 'src/forge-style-intelligence.mjs'
      - 'src/design-forge-ui.mjs'
      - 'src/forge-compare-ui.mjs'
      - 'src/forge-api.mjs'
      - 'src/forge-correction.mjs'
      - 'src/forge-convergence.mjs'
      - 'src/forge-runner.mjs'
      - 'src/reference-vault.mjs'
      - 'src/external-reference-to-forge.mjs'
      - 'src/forge-safe-integration.mjs'
      - 'scripts/forge_integration_review.mjs'
      - 'src/forge-convergence-ui.mjs'
      - 'src/reference-analysis.mjs'
      - 'src/reference-assets.mjs'
      - 'src/server.mjs'
      - 'scripts/forge_capture.mjs'
      - 'scripts/forge_converge.mjs'
      - 'scripts/forge_pixel_metric.py'
      - 'scripts/forge_export.mjs'
      - 'scripts/forge_reconstruct.mjs'
      - 'scripts/forge_reference_extract.mjs'
      - 'tests/design-forge.test.mjs'
      - 'tests/forge-api.test.mjs'
      - 'tests/forge-correction.test.mjs'
      - 'tests/forge-convergence.test.mjs'
      - 'tests/forge-runner.test.mjs'
      - 'tests/reference-vault.test.mjs'
      - 'tests/external-reference-to-forge.test.mjs'
      - 'tests/forge-safe-integration.test.mjs'
      - 'tests/reference-assets.test.mjs'
      - 'tests/ffax-reference-fidelity.test.mjs'
permissions:
  contents: read
concurrency:
  group: ffax-forge-p1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check of new code and attached core
        run: |
          node --check src/core.mjs
          node --check src/design-forge.mjs
          node --check src/forge-style-intelligence.mjs
          node --check src/design-forge-ui.mjs
          node --check src/forge-compare-ui.mjs
          node --check src/forge-api.mjs
          node --check src/forge-correction.mjs
          node --check src/forge-convergence.mjs
          node --check src/forge-runner.mjs
          node --check src/reference-vault.mjs
          node --check src/external-reference-to-forge.mjs
          node --check src/forge-safe-integration.mjs
          node --check scripts/forge_integration_review.mjs
          node --check src/forge-convergence-ui.mjs
          node --check src/reference-analysis.mjs
          node --check src/reference-assets.mjs
          node --check src/server.mjs
          node --check scripts/forge_capture.mjs
          node --check scripts/forge_converge.mjs
          node --check scripts/forge_export.mjs
          node --check scripts/forge_reconstruct.mjs
          node --check scripts/forge_reference_extract.mjs
          python -m py_compile scripts/forge_capture.py scripts/forge_pixel_metric.py
      - name: Local deterministic core source contract smoke (no model/network)
        run: node --test tests/design-forge.test.mjs tests/forge-api.test.mjs tests/forge-correction.test.mjs tests/forge-convergence.test.mjs tests/forge-runner.test.mjs tests/reference-vault.test.mjs tests/external-reference-to-forge.test.mjs tests/forge-safe-integration.test.mjs tests/reference-assets.test.mjs tests/ffax-reference-fidelity.test.mjs
