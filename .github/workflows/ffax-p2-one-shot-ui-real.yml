name: FFAX P2 real pinned one-shot-ui
on:
  push:
    branches:
      - feature/ffax-reference-fidelity-20261118
    paths:
      - .github/workflows/ffax-p2-one-shot-ui-real.yml
      - scripts/ffax_reference_fidelity.mjs
      - scripts/ffax_local_report_guard.mjs
      - scripts/forge_reference_extract.mjs
      - scripts/p2_upstream_one_shot_probe.mjs
      - tests/ffax-reference-fidelity.test.mjs
permissions:
  contents: read
jobs:
  real-upstream-cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned MIT upstream in disposable runner temp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:FFAX_ONE_SHOT_DIR = Join-Path $env:RUNNER_TEMP 'ffax-p2-one-shot'
          New-Item -ItemType Directory -Force -Path $env:FFAX_ONE_SHOT_DIR | Out-Null
          npm install --prefix $env:FFAX_ONE_SHOT_DIR --ignore-scripts --no-audit --no-fund --no-package-lock --save=false -- one-shot-ui@0.12.0
          if ($LASTEXITCODE -ne 0) { throw 'PINNED_UPSTREAM_NPM_INSTALL_FAILED' }
          node --input-type=module -e 'import {readFileSync} from "node:fs"; import {join} from "node:path"; const pkg=JSON.parse(readFileSync(join(process.env.FFAX_ONE_SHOT_DIR,"node_modules","one-shot-ui","package.json"),"utf8")); if(pkg.name!=="one-shot-ui"||pkg.version!=="0.12.0"||pkg.license!=="MIT"||pkg.bin?.["one-shot-ui"]!=="dist/cli.mjs")process.exit(1); console.log("UPSTREAM_PIN_METADATA_PASS",pkg.name,pkg.version,pkg.license);'
          if ($LASTEXITCODE -ne 0) { throw 'PINNED_UPSTREAM_LICENSE_OR_VERSION_FAILED' }
      - name: Real compare, suggest and structural extract with synthetic local PNGs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:NO_COLOR = '1'
          $env:FFAX_ONE_SHOT_CLI = Join-Path (Join-Path $env:RUNNER_TEMP 'ffax-p2-one-shot') 'node_modules/one-shot-ui/dist/cli.mjs'
          node scripts/p2_upstream_one_shot_probe.mjs
          if ($LASTEXITCODE -ne 0) { throw 'UPSTREAM_FFAX_COMPATIBILITY_FAILED' }
