name: FFAX manual verification (opt-in)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/ffax-workbench-p85-20261112
    paths:
      - '.github/workflows/ffax-manual-ci.yml'
      - 'package.json'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'index.html'
      - 'styles.css'
permissions:
  contents: read
concurrency:
  group: ffax-manual-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned development dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Unit and synthetic fixture regression
        run: npm test
      - name: React 19 real runtime + TypeScript strict probes
        run: npm run test:react-real
      - name: Structured TSX contract checks
        run: |
          npm run test:model-contract
          npm run test:provider-contract
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install development dependencies without postinstall scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Windows Node regression and real React 19 synthetic rendering
        run: |
          npm test
          npm run test:react-real
      - name: Windows native localhost HTTP / static assets / consent gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $proc = Start-Process -FilePath "node" -ArgumentList "src/server.mjs" -PassThru -NoNewWindow
          try {
            $ready = $false
            for($i=0; $i -lt 35; $i++){
              try {
                $page = Invoke-WebRequest "http://127.0.0.1:4173/" -TimeoutSec 3
                if($page.StatusCode -eq 200){ $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 300 }
            }
            if(-not $ready){ throw "WINDOWS_LOCAL_SERVER_START_FAILED" }
            foreach($p in @("/styles.css","/src/app.mjs","/src/core.mjs","/assets/ffax-favicon.svg")){
              $r = Invoke-WebRequest ("http://127.0.0.1:4173"+$p) -TimeoutSec 5
              if($r.StatusCode -ne 200){ throw "WINDOWS_ASSET_NOT_200 $p" }
            }
            if($page.Content -notmatch "local-model-name"){ throw "WINDOWS_LOCAL_MODEL_UI_MISSING" }
            $blocked = $false
            try {
              Invoke-WebRequest "http://127.0.0.1:4173/api/local-model" -Method POST -ContentType "application/json" -Body "{}" -TimeoutSec 3 | Out-Null
            } catch {
              if([int]$_.Exception.Response.StatusCode -eq 403){ $blocked = $true }
            }
            if(-not $blocked){throw "WINDOWS_LOCAL_CONSENT_GATE_UNSAFE"}
            Write-Output "WINDOWS_NATIVE_SMOKE_PASS status=200 assets=4 blocked_origin=403"
          } finally {
            if($proc -and -not $proc.HasExited){ Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: |
          python -m pip install 'playwright==1.56.0' 'Pillow==11.3.0'
          sudo apt-get update && sudo apt-get install -y chromium
      - name: Node and TypeScript tools
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Browser controls / responsive
        run: |
          python scripts/browser_qa.py
          python scripts/manual_browser_probe.py
          python scripts/accessibility_probe.py
          python scripts/contrast_probe.py
          python scripts/served_browser_qa.py
          python scripts/axe_offline_audit.py
      - name: Keep QA screenshots and detailed axe report on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffax-browser-evidence
          path: artifacts/qa/
          if-no-files-found: warn
          retention-days: 7
      - name: Local end-to-end rehearsal
        run: node scripts/local_acceptance_gate.mjs
