name: FFAX manual verification (opt-in)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/ffax-workbench-p85-20261112
    paths:
      - '.github/workflows/ffax-manual-ci.yml'
      - 'package.json'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'index.html'
      - 'styles.css'
permissions:
  contents: read
concurrency:
  group: ffax-manual-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned development dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Unit and synthetic fixture regression
        run: npm test
      - name: React 19 real runtime + TypeScript strict probes
        run: npm run test:react-real
      - name: All 17 registry patterns strict TSX and React19 SSR
        run: node scripts/complete_component_registry_probe.mjs
      - name: Structured TSX contract checks
        run: |
          npm run test:model-contract
          npm run test:provider-contract
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install development dependencies without postinstall scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Windows Node regression and real React 19 synthetic rendering
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:react-real
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/complete_component_registry_probe.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows native localhost HTTP / static assets / consent gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $proc = Start-Process -FilePath "node" -ArgumentList "src/server.mjs" -PassThru -NoNewWindow
          try {
            $ready = $false
            for($i=0; $i -lt 35; $i++){
              try {
                $page = Invoke-WebRequest "http://127.0.0.1:4173/" -TimeoutSec 3
                if($page.StatusCode -eq 200){ $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 300 }
            }
            if(-not $ready){ throw "WINDOWS_LOCAL_SERVER_START_FAILED" }
            foreach($p in @("/styles.css","/src/app.mjs","/src/core.mjs","/assets/ffax-favicon.svg")){
              $r = Invoke-WebRequest ("http://127.0.0.1:4173"+$p) -TimeoutSec 5
              if($r.StatusCode -ne 200){ throw "WINDOWS_ASSET_NOT_200 $p" }
            }
            if($page.Content -notmatch "local-model-name"){ throw "WINDOWS_LOCAL_MODEL_UI_MISSING" }
            $blocked = $false
            try {
              Invoke-WebRequest "http://127.0.0.1:4173/api/local-model" -Method POST -ContentType "application/json" -Body "{}" -TimeoutSec 3 | Out-Null
            } catch {
              if([int]$_.Exception.Response.StatusCode -eq 403){ $blocked = $true }
            }
            if(-not $blocked){throw "WINDOWS_LOCAL_CONSENT_GATE_UNSAFE"}
            Write-Output "WINDOWS_NATIVE_SMOKE_PASS status=200 assets=4 blocked_origin=403"
          } finally {
            if($proc -and -not $proc.HasExited){ Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: |
          python -m pip install 'playwright==1.56.0' 'Pillow==11.3.0'
          python -m playwright install chromium
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
          # Ubuntu chromium-browser is a Snap wrapper; avoid network-bound Snap assertions.
          CHROME_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          if [ ! -x "$CHROME_PATH" ]; then echo "PLAYWRIGHT_CHROMIUM_NOT_FOUND"; exit 1; fi
          sudo ln -sfn "$CHROME_PATH" /usr/bin/chromium
          /usr/bin/chromium --version
      - name: Node and TypeScript tools
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Browser controls / responsive
        run: |
          python scripts/browser_qa.py
          python scripts/manual_browser_probe.py
          python scripts/accessibility_probe.py
          python scripts/contrast_probe.py
          python scripts/served_browser_qa.py
          python scripts/export_layout_browser_probe.py
          python scripts/export_visual_token_browser_probe.py
          python scripts/repo_intake_browser_probe.py
          python scripts/github_readonly_browser_probe.py
          python scripts/device_checkpoint_browser_probe.py
          python scripts/component_insertion_browser_probe.py
          python scripts/demo_interactions_browser_probe.py
          python scripts/axe_offline_audit.py
      - name: Local end-to-end rehearsal
        run: node scripts/local_acceptance_gate.mjs
      - name: Offline fresh-copy cleanroom regression
        run: npm run test:cleanroom
      - name: Keep QA screenshots and detailed axe report on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffax-browser-evidence
          path: artifacts/qa/
          if-no-files-found: warn
          retention-days: 7

  package-owner-review:
    needs: [offline-node, windows-native, browser-qa]
    if: ${{ success() }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned owner-review source ZIP (no model weights or secrets)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $PWD "FFAX-OWNER-REVIEW"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          foreach($name in @("src","assets","index.html","styles.css","package.json","START-FFAX.cmd","RUN-LIVE-MODEL-CHECK.cmd","OWNER_QUICKSTART_KO.md","THIRD_PARTY_NOTICES.md","REQUIREMENTS.md")){
            if(-not (Test-Path -LiteralPath $name)){throw "MISSING_REVIEW_FILE $name"}
            Copy-Item -LiteralPath $name -Destination $out -Recurse -Force
          }
          New-Item -ItemType Directory -Path (Join-Path $out "scripts") -Force | Out-Null
          Copy-Item -LiteralPath "scripts/react_real_probe.mjs" -Destination (Join-Path $out "scripts/react_real_probe.mjs") -Force
          foreach($p in @("package.json","scripts/react_real_probe.mjs","RUN-LIVE-MODEL-CHECK.cmd")) { if(-not (Test-Path -LiteralPath (Join-Path $out $p))) { throw "OWNER_LIVE_PROBE_PACKAGING_INCOMPLETE $p" } }
          Set-Content -LiteralPath (Join-Path $out "SOURCE_SHA.txt") -Value "${{ github.sha }}" -Encoding ascii
          $zip = Join-Path $PWD "FFAX-OWNER-REVIEW.zip"
          Compress-Archive -Path $out -DestinationPath $zip -CompressionLevel Optimal
          if(-not (Test-Path -LiteralPath $zip)){throw "PACKAGE_NOT_CREATED"}
          $hash=(Get-FileHash -Algorithm SHA256 $zip).Hash
          Write-Output "REVIEW_ZIP_OK hash=$hash source=${{ github.sha }} distribution=UNRELEASED"
          $inspect = Join-Path $PWD "VERIFY-OWNER-REVIEW"
          Expand-Archive -LiteralPath $zip -DestinationPath $inspect -Force
          $unpacked = Join-Path $inspect "FFAX-OWNER-REVIEW"
          $embeddedSha = (Get-Content -LiteralPath (Join-Path $unpacked "SOURCE_SHA.txt") -Raw).Trim()
          if($embeddedSha -ne "${{ github.sha }}"){throw "REVIEW_PACKAGE_SHA_MISMATCH"}
          foreach($rel in @("src/server.mjs","src/app.mjs","src/core.mjs","scripts/react_real_probe.mjs","RUN-LIVE-MODEL-CHECK.cmd","package.json")){
            $candidate = Join-Path $unpacked $rel
            if(-not(Test-Path -LiteralPath $candidate)){throw "REVIEW_PACKAGE_MISSING $rel"}
          }
          & node --check (Join-Path $unpacked "src/server.mjs")
          if($LASTEXITCODE -ne 0){throw "REVIEW_PACKAGE_SERVER_SYNTAX_INVALID"}
          & node --check (Join-Path $unpacked "scripts/react_real_probe.mjs")
          if($LASTEXITCODE -ne 0){throw "REVIEW_PACKAGE_PROBE_SYNTAX_INVALID"}
          Write-Output "REVIEW_PACKAGE_EXTRACT_SHA_AND_SYNTAX_PASS"
      - name: Upload unsigned review ZIP for seven days
        uses: actions/upload-artifact@v4
        with:
          name: ffax-owner-review-unreleased
          path: FFAX-OWNER-REVIEW.zip
          if-no-files-found: error
          retention-days: 7
